[EMC]
VERSION = 1.1
MACHINE = Sim-twinspindlekins (XYZBCW mill-turn, two spindles)
  DEBUG = 0

[DISPLAY]
# X Y Z are already the tip in the frame of the part the type works on, so
# the plot takes them as they are: a rotary in GEOMETRY would turn them
# again, and W, a translation there, would draw as a move along Z
         GEOMETRY = XYZ
          DISPLAY = axis
        OPEN_FILE = ./twin-spindle-holes.ngc
       INCREMENTS = 10 mm, 1 mm, .1 mm
         JOG_AXES = XYZ
       CYCLE_TIME = 0.100
  POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.0
   PROGRAM_PREFIX = ../../nc_files/
    INTRO_GRAPHIC = linuxcnc.gif
       INTRO_TIME = 2
      TOOL_EDITOR = tooledit z diam

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G80 G90 G94 G97
   PARAMETER_FILE = twinspindle.var

[EMCMOT]
      EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
      TASK = milltask
CYCLE_TIME = 0.010

[HAL]
  HALUI = halui
HALFILE = LIB:basic_sim.tcl
HALFILE = twinspindle.hal

[TRAJ]
              COORDINATES = XYZBCW
             LINEAR_UNITS = mm
            ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50.0
    MAX_LINEAR_VELOCITY = 200.0
MAX_LINEAR_ACCELERATION = 800.0
DEFAULT_LINEAR_ACCELERATION = 800.0
     MAX_ANGULAR_VELOCITY = 360.0

[EMCIO]
TOOL_TABLE = twinspindle.tbl

[KINS]
# type 0: the part in the main spindle, C and B orient
# type 1: the part in the sub spindle, W and B orient
# type 2: identity, the machine frame
KINEMATICS = twinspindlekins
    JOINTS = 6

[AXIS_X]
       MIN_LIMIT = -400
       MAX_LIMIT =  500
    MAX_VELOCITY =  200
MAX_ACCELERATION =  800

[AXIS_Y]
       MIN_LIMIT = -300
       MAX_LIMIT =  300
    MAX_VELOCITY =  200
MAX_ACCELERATION =  800

[AXIS_Z]
       MIN_LIMIT = -300
       MAX_LIMIT =  800
    MAX_VELOCITY =  200
MAX_ACCELERATION =  800

[AXIS_B]
       MIN_LIMIT =  -30
       MAX_LIMIT =  210
    MAX_VELOCITY =   90
MAX_ACCELERATION =  400

# the main spindle
[AXIS_C]
  WRAPPED_ROTARY = 1
       MIN_LIMIT = -1e9
       MAX_LIMIT =  1e9
    MAX_VELOCITY =  180
MAX_ACCELERATION =  720

# the sub spindle: an angle, so ANGULAR, however the letter reads
[AXIS_W]
            TYPE = ANGULAR
  WRAPPED_ROTARY = 1
       MIN_LIMIT = -1e9
       MAX_LIMIT =  1e9
    MAX_VELOCITY =  180
MAX_ACCELERATION =  720

# the joints home to the head over the middle, pointing down at the
# spindle line, clear of both parts
[JOINT_0]
            TYPE = LINEAR
    MAX_VELOCITY =  200
MAX_ACCELERATION =  800
       MIN_LIMIT = -400
       MAX_LIMIT =  500
            HOME =  300
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

[JOINT_1]
            TYPE = LINEAR
    MAX_VELOCITY =  200
MAX_ACCELERATION =  800
       MIN_LIMIT = -300
       MAX_LIMIT =  300
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

[JOINT_2]
            TYPE = LINEAR
    MAX_VELOCITY =  200
MAX_ACCELERATION =  800
       MIN_LIMIT = -300
       MAX_LIMIT =  800
            HOME =   50
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

[JOINT_3]
            TYPE = ANGULAR
    MAX_VELOCITY =   90
MAX_ACCELERATION =  400
       MIN_LIMIT =  -30
       MAX_LIMIT =  210
            HOME =   90
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

[JOINT_4]
            TYPE = ANGULAR
    MAX_VELOCITY =  180
MAX_ACCELERATION =  720
       MIN_LIMIT = -1e9
       MAX_LIMIT =  1e9
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

[JOINT_5]
            TYPE = ANGULAR
    MAX_VELOCITY =  180
MAX_ACCELERATION =  720
       MIN_LIMIT = -1e9
       MAX_LIMIT =  1e9
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

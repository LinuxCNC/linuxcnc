[EMC]
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G64 P0.001 G80 G90 G92.1 G94 G97 G98
PARAMETER_FILE = sim.var
SUBROUTINE_PATH = .
ON_ABORT_COMMAND = o <abort> call

[KINS]
# switchkins-type 0 is 5axiskins, 1 is identity, 2 is the userk template
KINEMATICS = 5axiskins coordinates=xyzbcw
JOINTS = 6

[HAL]
HALFILE = sim.hal

[TRAJ]
# A sim that moves fast, to keep the run short: the checks on the program's
# W stroke sample status, and W rests on a dwell at its end.
COORDINATES = XYZBCW
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
DEFAULT_LINEAR_VELOCITY = 10000
MAX_LINEAR_VELOCITY = 10000
MAX_LINEAR_ACCELERATION = 100000
DEFAULT_LINEAR_ACCELERATION = 100000
MAX_ANGULAR_VELOCITY = 360

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 4

[TASK]
TASK = milltask
# a short cycle: the switch after the program's G0 W0 reaches motion within
# a few servo cycles of the move's end
CYCLE_TIME = 0.001

[EMCIO]
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = -500
MAX_LIMIT = 500
MAX_VELOCITY = 10000
MAX_ACCELERATION = 100000

[AXIS_Y]
MIN_LIMIT = -500
MAX_LIMIT = 500
MAX_VELOCITY = 10000
MAX_ACCELERATION = 100000

[AXIS_Z]

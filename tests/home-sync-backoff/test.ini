[EMC]
VERSION = 1.1
MACHINE = home-sync-backoff
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = home-sync-backoff.hal

[TRAJ]
COORDINATES = XX
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10.0
MAX_LINEAR_VELOCITY = 100.0

[KINS]
KINEMATICS = trivkins coordinates=XX kinstype=BOTH
JOINTS = 2

[AXIS_X]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 1000.0

# The switches are 2 mm out of line: at HOME (square) joint 0 sits 1 mm
# short of its switch and joint 1 1 mm into its own.
[JOINT_0]
# Bridge model, see home-sync-backoff.hal: strain limit and strain rate
# limit (half the distance and half the relative velocity of the sides).
BRIDGE_FLEX = 1.2
BRIDGE_SLIP = 12.5
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = -1.0
HOME_SEARCH_VEL = -20.0
HOME_LATCH_VEL = 5.0
HOME_FINAL_VEL = 5.0
HOME_SEQUENCE = -1
FERROR = 0.1
MIN_FERROR = 0.1
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 1000.0
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = 1.0
HOME_SEARCH_VEL = -20.0
HOME_LATCH_VEL = 5.0
HOME_FINAL_VEL = 5.0
HOME_SEQUENCE = -1
FERROR = 0.1
MIN_FERROR = 0.1
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 1000.0
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0

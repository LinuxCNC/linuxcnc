[EMC]
VERSION = 1.1
MACHINE = home-absolute-encoder
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = home-absolute-encoder.hal

[TRAJ]
COORDINATES = X
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10.0
MAX_LINEAR_VELOCITY = 100.0
POSITION_FILE = position.txt

[KINS]
KINEMATICS = trivkins coordinates=X
JOINTS = 1

[AXIS_X]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 1000.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = 5.0
HOME_ABSOLUTE_ENCODER = 2
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 1000.0
# motor-pos-fb is set directly by the test and never follows
# motor-pos-cmd, so keep following error out of the way.
FERROR = 1000.0
MIN_FERROR = 1000.0
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0

[EMC]
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py
MAX_FEED_OVERRIDE = 100

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G80 G90 G94 G97
PARAMETER_FILE = sim.var

[KINS]
KINEMATICS = twinspindlekins
JOINTS = 6

[HAL]
HALFILE = sim.hal

[TRAJ]
# the rates are high so the moves are short: the test checks only where
# they end; the feed override runs the drilling of the demo program fast
COORDINATES = XYZBCW
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 4000
MAX_LINEAR_ACCELERATION = 80000
DEFAULT_LINEAR_ACCELERATION = 80000
MAX_ANGULAR_VELOCITY = 7200

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 4

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[EMCIO]
TOOL_TABLE = tool.tbl

[AXIS_X]
       MIN_LIMIT = -400
       MAX_LIMIT =  500
    MAX_VELOCITY =  4000
MAX_ACCELERATION =  80000

[AXIS_Y]
       MIN_LIMIT = -300
       MAX_LIMIT =  300
    MAX_VELOCITY =  4000
MAX_ACCELERATION =  80000

[AXIS_Z]
       MIN_LIMIT = -300
       MAX_LIMIT =  800
    MAX_VELOCITY =  4000
MAX_ACCELERATION =  80000

[AXIS_B]
       MIN_LIMIT =  -30
       MAX_LIMIT =  210
    MAX_VELOCITY =   1800
MAX_ACCELERATION =  40000

# the main spindle
[AXIS_C]
  WRAPPED_ROTARY = 1
       MIN_LIMIT = -1e9
       MAX_LIMIT =  1e9
    MAX_VELOCITY =  3600
MAX_ACCELERATION =  72000

# the sub spindle: an angle, so ANGULAR, however the letter reads
[AXIS_W]
            TYPE = ANGULAR
  WRAPPED_ROTARY = 1
       MIN_LIMIT = -1e9
       MAX_LIMIT =  1e9
    MAX_VELOCITY =  3600
MAX_ACCELERATION =  72000

# the joints home to the head over the middle, pointing down at the
# spindle line, clear of both parts
[JOINT_0]
            TYPE = LINEAR
    MAX_VELOCITY =  4000
MAX_ACCELERATION =  80000
       MIN_LIMIT = -400
       MAX_LIMIT =  500
            HOME =  300
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

[JOINT_1]
            TYPE = LINEAR
    MAX_VELOCITY =  4000
MAX_ACCELERATION =  80000
       MIN_LIMIT = -300
       MAX_LIMIT =  300
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

[JOINT_2]
            TYPE = LINEAR
    MAX_VELOCITY =  4000
MAX_ACCELERATION =  80000
       MIN_LIMIT = -300
       MAX_LIMIT =  800
            HOME =   50
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

[JOINT_3]
            TYPE = ANGULAR
    MAX_VELOCITY =   1800
MAX_ACCELERATION =  40000
       MIN_LIMIT =  -30
       MAX_LIMIT =  210
            HOME =   90
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

[JOINT_4]
            TYPE = ANGULAR
    MAX_VELOCITY =  3600
MAX_ACCELERATION =  72000
       MIN_LIMIT = -1e9
       MAX_LIMIT =  1e9
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

[JOINT_5]
            TYPE = ANGULAR
    MAX_VELOCITY =  3600
MAX_ACCELERATION =  72000
       MIN_LIMIT = -1e9
       MAX_LIMIT =  1e9
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

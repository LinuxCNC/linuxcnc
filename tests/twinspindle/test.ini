[EMC]
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G80 G90 G94 G97
PARAMETER_FILE = sim.var

[KINS]
KINEMATICS = twinspindlekins
JOINTS = 6

[HAL]
HALFILE = sim.hal

[TRAJ]
COORDINATES = XYZBCW
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 200
MAX_LINEAR_ACCELERATION = 800
DEFAULT_LINEAR_ACCELERATION = 800
MAX_ANGULAR_VELOCITY = 360

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 4

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[EMCIO]
TOOL_TABLE = tool.tbl

[AXIS_X]
       MIN_LIMIT = -400
       MAX_LIMIT =  500
    MAX_VELOCITY =  200
MAX_ACCELERATION =  800

[AXIS_Y]
       MIN_LIMIT = -300
       MAX_LIMIT =  300
    MAX_VELOCITY =  200
MAX_ACCELERATION =  800

[AXIS_Z]
       MIN_LIMIT = -300
       MAX_LIMIT =  800
    MAX_VELOCITY =  200
MAX_ACCELERATION =  800

[AXIS_B]
       MIN_LIMIT =  -30
       MAX_LIMIT =  210
    MAX_VELOCITY =   90
MAX_ACCELERATION =  400

# the main spindle
[AXIS_C]
  WRAPPED_ROTARY = 1
       MIN_LIMIT = -1e9
       MAX_LIMIT =  1e9
    MAX_VELOCITY =  180
MAX_ACCELERATION =  720

# the sub spindle: an angle, so ANGULAR, however the letter reads
[AXIS_W]
            TYPE = ANGULAR
  WRAPPED_ROTARY = 1
       MIN_LIMIT = -1e9
       MAX_LIMIT =  1e9
    MAX_VELOCITY =  180
MAX_ACCELERATION =  720

# the joints home to the head over the middle, pointing down at the
# spindle line, clear of both parts
[JOINT_0]
            TYPE = LINEAR
    MAX_VELOCITY =  200
MAX_ACCELERATION =  800
       MIN_LIMIT = -400
       MAX_LIMIT =  500
            HOME =  300
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

[JOINT_1]
            TYPE = LINEAR
    MAX_VELOCITY =  200
MAX_ACCELERATION =  800
       MIN_LIMIT = -300
       MAX_LIMIT =  300
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

[JOINT_2]
            TYPE = LINEAR
    MAX_VELOCITY =  200
MAX_ACCELERATION =  800
       MIN_LIMIT = -300
       MAX_LIMIT =  800
            HOME =   50
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

[JOINT_3]
            TYPE = ANGULAR
    MAX_VELOCITY =   90
MAX_ACCELERATION =  400
       MIN_LIMIT =  -30
       MAX_LIMIT =  210
            HOME =   90
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

[JOINT_4]
            TYPE = ANGULAR
    MAX_VELOCITY =  180
MAX_ACCELERATION =  720
       MIN_LIMIT = -1e9
       MAX_LIMIT =  1e9
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

[JOINT_5]
            TYPE = ANGULAR
    MAX_VELOCITY =  180
MAX_ACCELERATION =  720
       MIN_LIMIT = -1e9
       MAX_LIMIT =  1e9
 HOME_SEARCH_VEL =    0
   HOME_SEQUENCE =    0

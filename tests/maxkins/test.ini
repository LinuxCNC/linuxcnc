[EMC]
# The version string for this INI file.
VERSION = 1.1

DEBUG = 0

[MAX]
# distance from the end of the reference tool to the centre of the head
# tilt axis, and the length of the tool on top of it
B_PIVOT_LENGTH = 100
TOOL_LENGTH = 25

[DISPLAY]
DISPLAY = ./test-ui.py

[FILTER]
#No Content

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
HALUI = halui
HALFILE = core_sim.hal

[HALUI]
#No Content

[TRAJ]
COORDINATES =           X Y Z A B C U V W
HOME =                  0 0 0 0 0 0 0 0 0
LINEAR_UNITS =          mm
ANGULAR_UNITS =         degree
DEFAULT_LINEAR_VELOCITY =       10
MAX_LINEAR_VELOCITY =          100
MAX_LINEAR_ACCELERATION =     1000
DEFAULT_ANGULAR_VELOCITY =      10
MAX_ANGULAR_VELOCITY =         100
MAX_ANGULAR_ACCELERATION =    1000

[EMCIO]
TOOL_TABLE = tool.tbl
RANDOM_TOOLCHANGER = 0

[KINS]
KINEMATICS = maxkins
JOINTS = 9

[AXIS_X]
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000


[EMC]
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
HALFILE = sim.hal

[HALUI]
MDI_COMMAND = G0 X0

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 40

[EMCIO]
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 40
MAX_ACCELERATION = 1000.0

[JOINT_0]
TYPE = LINEAR
HOME_SEQUENCE = 0
MAX_VELOCITY = 40
MAX_ACCELERATION = 1000.0
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
FERROR = 1
MIN_FERROR = 1

[AXIS_Y]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 40
MAX_ACCELERATION = 1000.0

[JOINT_1]
TYPE = LINEAR
HOME_SEQUENCE = 0
MAX_VELOCITY = 40
MAX_ACCELERATION = 1000.0
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
FERROR = 1
MIN_FERROR = 1

[AXIS_Z]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 40
MAX_ACCELERATION = 1000.0

[JOINT_2]
TYPE = LINEAR
HOME_SEQUENCE = 0
MAX_VELOCITY = 40
MAX_ACCELERATION = 1000.0
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
FERROR = 1
MIN_FERROR = 1

[EMC]
VERSION = 1.1
DEBUG = 0
[DISPLAY]
DISPLAY = ../shared/test-ui.py
[RS274NGC]
PARAMETER_FILE = sim.var
SUBROUTINE_PATH = ../shared/subs
REMAP=T   prolog=prepare_prolog ngc=prepare epilog=prepare_epilog
REMAP=M6  modalgroup=6 prolog=change_prolog ngc=change epilog=change_epilog
REMAP=M61 modalgroup=6 prolog=settool_prolog ngc=settool epilog=settool_epilog
[PYTHON]
PATH_APPEND = ../shared/python
PATH_APPEND = ../../../../nc_files/remap_lib/python-stdglue
TOPLEVEL = ../shared/python/toplevel.py
[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
SERVO_PERIOD = 1000000
[TASK]
TASK = milltask
CYCLE_TIME = 0.001
[HAL]
HALFILE = ../shared/pocket.hal
[TRAJ]
NO_FORCE_HOMING = 1
COORDINATES = XYZ
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 4
[EMCIO]
TOOL_TABLE = pockets.tbl
RANDOM_TOOLCHANGER = 1
[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3
[AXIS_X]
MIN_LIMIT = -40.0
MAX_LIMIT = 40.0
MAX_VELOCITY = 4
MAX_ACCELERATION = 100
[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -40.0
MAX_LIMIT = 40.0
MAX_VELOCITY = 4
MAX_ACCELERATION = 100
HOME_SEQUENCE = 0
[AXIS_Y]
MIN_LIMIT = -40.0
MAX_LIMIT = 40.0
MAX_VELOCITY = 4
MAX_ACCELERATION = 100
[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -40.0
MAX_LIMIT = 40.0
MAX_VELOCITY = 4
MAX_ACCELERATION = 100
HOME_SEQUENCE = 0
[AXIS_Z]
MIN_LIMIT = -40.0
MAX_LIMIT = 40.0
MAX_VELOCITY = 4
MAX_ACCELERATION = 100
[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -40.0
MAX_LIMIT = 40.0
MAX_VELOCITY = 4
MAX_ACCELERATION = 100
HOME_SEQUENCE = 0

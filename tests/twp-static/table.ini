[EMC]
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G64 P0.001 G80 G90 G92.1 G94 G97 G98
PARAMETER_FILE = sim.var
RETAIN_WORK_PLANE = 1

[KINS]
KINEMATICS = xyzac-trt-kins sparm=identityfirst
JOINTS = 5

[HAL]
HALFILE = table.hal
HALCMD = setp xyzac-trt-kins.x-rot-point 100
HALCMD = setp xyzac-trt-kins.y-rot-point -50
HALCMD = setp xyzac-trt-kins.z-rot-point -80

[TRAJ]
COORDINATES = XYZAC
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
DEFAULT_LINEAR_VELOCITY = 10000
MAX_LINEAR_VELOCITY = 10000
MAX_LINEAR_ACCELERATION = 1000000
DEFAULT_LINEAR_ACCELERATION = 1000000
NO_FORCE_HOMING = 1

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 4

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[EMCIO]
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = -5000
MAX_LIMIT = 5000
MAX_VELOCITY = 10000
MAX_ACCELERATION = 1000000

[AXIS_Y]
MIN_LIMIT = -5000
MAX_LIMIT = 5000
MAX_VELOCITY = 10000
MAX_ACCELERATION = 1000000

[AXIS_Z]
MIN_LIMIT = -5000
MAX_LIMIT = 5000
MAX_VELOCITY = 10000
MAX_ACCELERATION = 1000000

[AXIS_A]
MIN_LIMIT = -120
MAX_LIMIT = 120
MAX_VELOCITY = 36000
MAX_ACCELERATION = 3600000

[AXIS_C]
MIN_LIMIT = -9999
MAX_LIMIT = 9999
MAX_VELOCITY = 36000
MAX_ACCELERATION = 3600000

[JOINT_0]
TYPE = LINEAR
HOME = 0

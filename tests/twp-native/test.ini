[EMC]
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G64 P0.001 G80 G90 G92.1 G94 G97 G98
PARAMETER_FILE = sim.var
# G53, G28, G30 and the stores in the machine frame off the machine frame type
MACHINE_MOVES_IN_MACHINE_FRAME = 1

[KINS]
KINEMATICS = xyzacb_trsrn
JOINTS = 6

# what the python oracle reads
[TWP]
PRIMARY = C
SECONDARY = B

[HAL]
HALFILE = sim.hal
HALCMD = setp xyzacb_trsrn_kins.nut-angle 45
HALCMD = setp xyzacb_trsrn_kins.y-pivot 100
HALCMD = setp xyzacb_trsrn_kins.z-pivot 200
HALCMD = setp xyzacb_trsrn_kins.x-offset 5
HALCMD = setp xyzacb_trsrn_kins.y-offset 7
HALCMD = setp xyzacb_trsrn_kins.y-rot-axis 300
HALCMD = setp xyzacb_trsrn_kins.z-rot-axis 400

[TRAJ]
# A sim that moves fast, to keep the run short: the checks on a path read
# it from the sampler, every servo cycle, and allow for the cycle.
COORDINATES = XYZABC
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
DEFAULT_LINEAR_VELOCITY = 10000
MAX_LINEAR_VELOCITY = 10000
MAX_LINEAR_ACCELERATION = 100000
DEFAULT_LINEAR_ACCELERATION = 100000
NO_FORCE_HOMING = 1

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 4

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[EMCIO]
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = -5000
MAX_LIMIT = 5000
MAX_VELOCITY = 10000
MAX_ACCELERATION = 100000

[AXIS_Y]
MIN_LIMIT = -5000
MAX_LIMIT = 5000
MAX_VELOCITY = 10000
MAX_ACCELERATION = 100000

[AXIS_Z]
MIN_LIMIT = -5000
MAX_LIMIT = 5000
MAX_VELOCITY = 10000
MAX_ACCELERATION = 100000

[AXIS_A]
MIN_LIMIT = -360
MAX_LIMIT = 360
MAX_VELOCITY = 36000
MAX_ACCELERATION = 360000

[AXIS_B]
MIN_LIMIT = -185
MAX_LIMIT = 185
MAX_VELOCITY = 36000
MAX_ACCELERATION = 360000

[AXIS_C]
MIN_LIMIT = -320
MAX_LIMIT = 320
MAX_VELOCITY = 36000
MAX_ACCELERATION = 360000


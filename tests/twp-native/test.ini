[EMC]
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G64 P0.001 G80 G90 G92.1 G94 G97 G98
PARAMETER_FILE = sim.var

[KINS]
KINEMATICS = xyzacb_trsrn
JOINTS = 6

# what the python oracle reads
[TWP]
PRIMARY = C
SECONDARY = B

[HAL]
HALFILE = sim.hal
HALCMD = setp xyzacb_trsrn_kins.nut-angle 45
HALCMD = setp xyzacb_trsrn_kins.y-pivot 100
HALCMD = setp xyzacb_trsrn_kins.z-pivot 200
HALCMD = setp xyzacb_trsrn_kins.x-offset 5
HALCMD = setp xyzacb_trsrn_kins.y-offset 7
HALCMD = setp xyzacb_trsrn_kins.y-rot-axis 300
HALCMD = setp xyzacb_trsrn_kins.z-rot-axis 400

[TRAJ]
COORDINATES = XYZABC
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
DEFAULT_LINEAR_VELOCITY = 100
MAX_LINEAR_VELOCITY = 120
MAX_LINEAR_ACCELERATION = 700
DEFAULT_LINEAR_ACCELERATION = 300
NO_FORCE_HOMING = 1

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 4

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[EMCIO]
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = -5000
MAX_LIMIT = 5000
MAX_VELOCITY = 200
MAX_ACCELERATION = 700

[AXIS_Y]
MIN_LIMIT = -5000
MAX_LIMIT = 5000
MAX_VELOCITY = 200
MAX_ACCELERATION = 700


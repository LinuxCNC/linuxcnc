[EMC]
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G64 P0.001 G80 G90 G94 G97
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[EMCIO]
TOOL_TABLE = tool.tbl

[HAL]
HALUI = halui
HALFILE = LIB:core_sim.hal
HALFILE = LIB:simulated_home.hal

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50.0
MAX_LINEAR_VELOCITY = 200.0
NO_FORCE_HOMING = 1

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[AXIS_X]
MIN_LIMIT = -500.0
MAX_LIMIT = 500.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 1250

[AXIS_Y]
MIN_LIMIT = -500.0
MAX_LIMIT = 500.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 1250

[AXIS_Z]
MIN_LIMIT = -500.0
MAX_LIMIT = 500.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 1250

[JOINT_0]
TYPE = LINEAR
MAX_VELOCITY = 100
MAX_ACCELERATION = 1250
MIN_LIMIT = -500.0
MAX_LIMIT = 500.0
HOME_SEQUENCE = 0

[JOINT_1]
TYPE = LINEAR
MAX_VELOCITY = 100
MAX_ACCELERATION = 1250
MIN_LIMIT = -500.0
MAX_LIMIT = 500.0
HOME_SEQUENCE = 0

[JOINT_2]
TYPE = LINEAR
MAX_VELOCITY = 100
MAX_ACCELERATION = 1250
MIN_LIMIT = -500.0
MAX_LIMIT = 500.0
HOME_SEQUENCE = 0

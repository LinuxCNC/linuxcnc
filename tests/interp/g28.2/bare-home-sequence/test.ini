[EMC]
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = ./test-ui.py

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[HAL]
HALUI = halui
HALFILE = LIB:core_sim.hal

[TRAJ]
AXES =                  3
COORDINATES =           X Y Z
HOME =                  0 0 0
# so the test can issue the bare G28.2 as a genuine first-home from MDI /
# a program on an unreferenced machine (the unattended-power-up case),
# not only as a re-home after the GUI has already homed it.
NO_FORCE_HOMING =       1
LINEAR_UNITS =          inch
ANGULAR_UNITS =         degree
DEFAULT_LINEAR_VELOCITY = 1.2
MAX_LINEAR_VELOCITY =   4

[KINS]
JOINTS = 3
KINEMATICS = trivkins

[AXIS_X]
MAX_VELOCITY =     4
MAX_ACCELERATION = 1000.0
MIN_LIMIT =        -40.0
MAX_LIMIT =        40.0

[AXIS_Y]
MAX_VELOCITY =     4
MAX_ACCELERATION = 1000.0
MIN_LIMIT =        -40.0
MAX_LIMIT =        40.0

[AXIS_Z]
MAX_VELOCITY =     4
MAX_ACCELERATION = 1000.0
MIN_LIMIT =        -4.0
MAX_LIMIT =        4.0

# Three distinct HOME_SEQUENCE groups: the bare G28.2 has to walk all of
# them, and the completion test has to stay "still homing" across the two
# gaps between groups (where every joint's per-joint .homing flag is
# momentarily false -- see the homing_active term in emctaskmain.cc).
[JOINT_0]
TYPE =             LINEAR
HOME =             0.000
HOME_SEQUENCE =    0
MAX_VELOCITY =     4
MAX_ACCELERATION = 1000.0
BACKLASH =         0.000
INPUT_SCALE =      4000
OUTPUT_SCALE =     1.000
MIN_LIMIT =        -40.0
MAX_LIMIT =        40.0
FERROR =           0.050
MIN_FERROR =       0.010

[JOINT_1]
TYPE =             LINEAR
HOME =             0.000
HOME_SEQUENCE =    1
MAX_VELOCITY =     4
MAX_ACCELERATION = 1000.0
BACKLASH =         0.000
INPUT_SCALE =      4000
OUTPUT_SCALE =     1.000
MIN_LIMIT =        -40.0
MAX_LIMIT =        40.0
FERROR =           0.050
MIN_FERROR =       0.010

[JOINT_2]
TYPE =             LINEAR
HOME =             0.0
HOME_SEQUENCE =    2
MAX_VELOCITY =     4
MAX_ACCELERATION = 1000.0
BACKLASH =         0.000
INPUT_SCALE =      4000
OUTPUT_SCALE =     1.000
MIN_LIMIT =        -4.0
MAX_LIMIT =        4.0
FERROR =           0.050
MIN_FERROR =       0.010

[EMCIO]
TOOL_CHANGE_QUILL_UP = 1
RANDOM_TOOLCHANGER = 0
TOOL_TABLE = sim.tbl

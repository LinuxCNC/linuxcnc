[EMC]
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G64 P0.001 G80 G90 G92.1 G94 G97 G98
PARAMETER_FILE = sim.var

[KINS]
# one type, the tool centre point, its joints the slides X to W in order;
# the joints reach further than the [AXIS_L] box, so the box is a
# restriction the config imposes and not the travel
KINEMATICS = maxkins
JOINTS = 9

[HAL]
HALFILE = maxkins.hal
HALCMD = setp maxkins.pivot-length 250

[TRAJ]
COORDINATES = XYZABCUVW
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
DEFAULT_LINEAR_VELOCITY = 200
MAX_LINEAR_VELOCITY = 346
MAX_LINEAR_ACCELERATION = 800
DEFAULT_LINEAR_ACCELERATION = 800
MAX_ANGULAR_VELOCITY = 360

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 4

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[EMCIO]
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = -500
MAX_LIMIT = 500
MAX_VELOCITY = 200
MAX_ACCELERATION = 800

[AXIS_Y]

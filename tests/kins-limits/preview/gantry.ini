# An identity machine, a gantry whose second Y joint has less travel than
# the axis: the joints are read off the axes, nothing is loaded.

[KINS]
KINEMATICS = trivkins coordinates=XYZY
JOINTS = 4

[TRAJ]
COORDINATES = XYZY
LINEAR_UNITS = mm
ANGULAR_UNITS = deg

[AXIS_X]
MIN_LIMIT = -2000
MAX_LIMIT = 2000

[AXIS_Y]
MIN_LIMIT = -2000
MAX_LIMIT = 2000

[AXIS_Z]
MIN_LIMIT = -2000
MAX_LIMIT = 2000

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -1000
MAX_LIMIT = 1000

[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -1000
MAX_LIMIT = 400

[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -1000
MAX_LIMIT = 1000

[JOINT_3]
TYPE = LINEAR
# the travel the gantry's Y is measured against
MIN_LIMIT = -1000
MAX_LIMIT = 380

# An identity machine with three joints and trivkins' default coordinates,
# XYZABCUVW, mapped over all the joints motion has, as trivkins maps them.

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = deg

[AXIS_X]
MIN_LIMIT = -1000
MAX_LIMIT = 1000

[AXIS_Y]
MIN_LIMIT = -1000
MAX_LIMIT = 1000

[AXIS_Z]
MIN_LIMIT = -1000
MAX_LIMIT = 1000

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -1000
MAX_LIMIT = 1000

[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -1000
MAX_LIMIT = 400

[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -1000
MAX_LIMIT = 1000

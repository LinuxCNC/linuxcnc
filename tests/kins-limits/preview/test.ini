# The preview's interpreter reads the kinematics, the joints' travel and
# the axis kinds from here; nothing else runs.

[KINS]
# switchkins-type 0 is 5axiskins, the tool centre point; 1 is identity
KINEMATICS = 5axiskins coordinates=xyzbcw
JOINTS = 6

[TRAJ]
COORDINATES = XYZBCW
LINEAR_UNITS = mm
ANGULAR_UNITS = deg

[AXIS_X]
MIN_LIMIT = -2000
MAX_LIMIT = 2000

[AXIS_Y]
MIN_LIMIT = -2000
MAX_LIMIT = 2000

[AXIS_Z]
MIN_LIMIT = -2000
MAX_LIMIT = 2000

[AXIS_B]
MIN_LIMIT = -120
MAX_LIMIT = 120

[AXIS_C]
MIN_LIMIT = -36000
MAX_LIMIT = 36000

[AXIS_W]
MIN_LIMIT = -100
MAX_LIMIT = 500

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -1000
MAX_LIMIT = 1000

[JOINT_1]
TYPE = LINEAR
# the travel the swings are measured against
MIN_LIMIT = -1000
MAX_LIMIT = 400

[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -1000
MAX_LIMIT = 1000

[JOINT_3]
TYPE = ANGULAR
MIN_LIMIT = -120
MAX_LIMIT = 120

[JOINT_4]
TYPE = ANGULAR
MIN_LIMIT = -36000
MAX_LIMIT = 36000

[JOINT_5]
TYPE = LINEAR
MIN_LIMIT = -100
MAX_LIMIT = 500

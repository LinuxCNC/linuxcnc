[EMC]
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G64 P0.001 G80 G90 G92.1 G94 G97 G98
PARAMETER_FILE = sim.var

[KINS]
KINEMATICS = pentakins
JOINTS = 5

[HAL]
HALFILE = pentapod.hal
HALFILE = pentapod-kins.hal

[TRAJ]
COORDINATES = XYZAB
HOME = 0 0 0 0 0
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
DEFAULT_LINEAR_VELOCITY = 20
MAX_LINEAR_VELOCITY = 50
MAX_LINEAR_ACCELERATION = 500
DEFAULT_LINEAR_ACCELERATION = 200
DEFAULT_ANGULAR_VELOCITY = 20
MAX_ANGULAR_VELOCITY = 30
NO_FORCE_HOMING = 1

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 4

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[EMCIO]
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = -250
MAX_LIMIT = 250
MAX_VELOCITY = 50
MAX_ACCELERATION = 500

[AXIS_Y]

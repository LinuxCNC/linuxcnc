[EMC]
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G64 P0.001 G80 G90 G92.1 G94 G97 G98
PARAMETER_FILE = sim.var

[KINS]
KINEMATICS = genhexkins
JOINTS = 6

[HAL]
HALFILE = hexapod.hal
HALFILE = hexapod-kins.hal

[TRAJ]
# the rates are high so the moves are short: the test checks only where
# they end
COORDINATES = XYZABC
HOME = 0 0 20 0 0 0
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
DEFAULT_LINEAR_VELOCITY = 200
MAX_LINEAR_VELOCITY = 500
MAX_LINEAR_ACCELERATION = 50000
DEFAULT_LINEAR_ACCELERATION = 20000
DEFAULT_ANGULAR_VELOCITY = 200
MAX_ANGULAR_VELOCITY = 300
NO_FORCE_HOMING = 1

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 4

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[EMCIO]
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = -10
MAX_LIMIT = 10
MAX_VELOCITY = 200
MAX_ACCELERATION = 20000

[AXIS_Y]
MIN_LIMIT = -10
MAX_LIMIT = 10
MAX_VELOCITY = 200
MAX_ACCELERATION = 20000

[AXIS_Z]

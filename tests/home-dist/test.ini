[EMC]
VERSION = 1.1
MACHINE = home-dist
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = home-dist.hal

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10.0
MAX_LINEAR_VELOCITY = 100.0

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0

[AXIS_Y]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0

[AXIS_Z]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0

# Joint 0 homes alone; joints 1 and 2 are a synchronized pair.
[JOINT_0]
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = -20.0
HOME_LATCH_VEL = -5.0
HOME_FINAL_VEL = 5.0
HOME_SEARCH_DIST = 5.0
HOME_LATCH_DIST = 2.0
HOME_SEQUENCE = 0
FERROR = 1.0
MIN_FERROR = 1.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = -20.0
HOME_LATCH_VEL = 5.0
HOME_FINAL_VEL = 5.0
HOME_SEARCH_DIST = 5.0
HOME_LATCH_DIST = 2.0
HOME_SEQUENCE = -1
FERROR = 1.0
MIN_FERROR = 1.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = -20.0
HOME_LATCH_VEL = 5.0
HOME_FINAL_VEL = 5.0
HOME_SEARCH_DIST = 5.0
HOME_LATCH_DIST = 3.0
HOME_SEQUENCE = -1
FERROR = 1.0
MIN_FERROR = 1.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0

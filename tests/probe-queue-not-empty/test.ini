[EMC]
VERSION = 1.1
DEBUG = 0x0

[DISPLAY]
DISPLAY = ./test-ui.py

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[EMCIO]
TOOL_TABLE = simpockets.tbl

[HAL]
HALFILE = LIB:core_sim.hal
HALFILE = probe.hal

[TRAJ]
NO_FORCE_HOMING = 1
COORDINATES = X Y Z
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 100

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MIN_LIMIT = -40.0
MAX_LIMIT = 40.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 10000.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 10000.0
MIN_LIMIT = -40.0
MAX_LIMIT = 40.0
FERROR = 0.050
MIN_FERROR = 0.010

[AXIS_Y]
MIN_LIMIT = -40.0
MAX_LIMIT = 40.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 10000.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 10000.0
MIN_LIMIT = -40.0
MAX_LIMIT = 40.0
FERROR = 0.050
MIN_FERROR = 0.010

[AXIS_Z]
MIN_LIMIT = -40.0
MAX_LIMIT = 40.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 10000.0

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 10000.0
MIN_LIMIT = -40.0
MAX_LIMIT = 40.0
FERROR = 0.050
MIN_FERROR = 0.010

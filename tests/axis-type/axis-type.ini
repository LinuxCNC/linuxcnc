[EMC]
VERSION = 1.1
DEBUG = 0x0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
HALFILE = axis-type.hal

[TRAJ]
NO_FORCE_HOMING = 1
COORDINATES = X Y Z A V
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 400
MAX_LINEAR_ACCELERATION = 50000

[EMCIO]
CYCLE_TIME = 0.100

[KINS]
KINEMATICS = trivkins
JOINTS = 5

[AXIS_X]
TYPE = LINEAR
MAX_VELOCITY = 100
MAX_ACCELERATION = 50000
MIN_LIMIT = -1000
MAX_LIMIT = 1000

[JOINT_0]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 100
MAX_ACCELERATION = 50000
MIN_LIMIT = -1000
MAX_LIMIT = 1000
FERROR = 1
MIN_FERROR = 1

[AXIS_Y]
TYPE = LINEAR
MAX_VELOCITY = 100
MAX_ACCELERATION = 50000
MIN_LIMIT = -1000
MAX_LIMIT = 1000

[JOINT_1]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 100
MAX_ACCELERATION = 50000
MIN_LIMIT = -1000
MAX_LIMIT = 1000
FERROR = 1
MIN_FERROR = 1

[AXIS_Z]
TYPE = LINEAR
MAX_VELOCITY = 100
MAX_ACCELERATION = 50000
MIN_LIMIT = -1000
MAX_LIMIT = 1000

[JOINT_2]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 100
MAX_ACCELERATION = 50000
MIN_LIMIT = -1000
MAX_LIMIT = 1000
FERROR = 1
MIN_FERROR = 1

[AXIS_A]
TYPE = LINEAR
MAX_VELOCITY = 100
MAX_ACCELERATION = 50000
MIN_LIMIT = -1000
MAX_LIMIT = 1000

[JOINT_3]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 100
MAX_ACCELERATION = 50000
MIN_LIMIT = -1000
MAX_LIMIT = 1000
FERROR = 1
MIN_FERROR = 1

[AXIS_V]
TYPE = ANGULAR
MAX_VELOCITY = 360
MAX_ACCELERATION = 50000
MIN_LIMIT = -1e+09
MAX_LIMIT = 1e+09
WRAPPED_ROTARY = 1

[JOINT_4]
TYPE = ANGULAR
HOME = 0
MAX_VELOCITY = 360
MAX_ACCELERATION = 50000
MIN_LIMIT = -1e+09
MAX_LIMIT = 1e+09
FERROR = 1

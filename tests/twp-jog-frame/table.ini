[EMC]
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-table.py

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G64 P0.001 G80 G90 G92.1 G94 G97 G98
PARAMETER_FILE = sim.var

# a trunnion: switchkins-type 0 is identity, 1 the tool centre point,
# which turns the work with A and C
[KINS]
KINEMATICS = xyzac-trt-kins sparm=identityfirst
JOINTS = 5

[HAL]
HALFILE = table.hal

[TRAJ]
COORDINATES = XYZAC
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 400
MAX_LINEAR_ACCELERATION = 1600
DEFAULT_LINEAR_ACCELERATION = 1600

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 4

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[EMCIO]
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 200
MAX_ACCELERATION = 1600

[AXIS_Y]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 200
MAX_ACCELERATION = 1600

[AXIS_Z]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 200
MAX_ACCELERATION = 1600

[AXIS_A]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 90
MAX_ACCELERATION = 900

[AXIS_C]
MIN_LIMIT = -400
MAX_LIMIT = 400
MAX_VELOCITY = 90
MAX_ACCELERATION = 900

[JOINT_0]
TYPE = LINEAR
MAX_VELOCITY = 200
MAX_ACCELERATION = 1600
MIN_LIMIT = -1000
MAX_LIMIT = 1000
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0

[JOINT_1]
TYPE = LINEAR
MAX_VELOCITY = 200
MAX_ACCELERATION = 1600
MIN_LIMIT = -1000
MAX_LIMIT = 1000
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0

[JOINT_2]
TYPE = LINEAR
MAX_VELOCITY = 200
MAX_ACCELERATION = 1600
MIN_LIMIT = -1000
MAX_LIMIT = 1000
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0

[JOINT_3]
TYPE = ANGULAR
MAX_VELOCITY = 90
MAX_ACCELERATION = 900
MIN_LIMIT = -400
MAX_LIMIT = 400
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0

[JOINT_4]
TYPE = ANGULAR
MAX_VELOCITY = 90
MAX_ACCELERATION = 900
MIN_LIMIT = -400
MAX_LIMIT = 400
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0

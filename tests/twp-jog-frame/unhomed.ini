[EMC]
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-unhomed.py

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G64 P0.001 G80 G90 G92.1 G94 G97 G98
PARAMETER_FILE = sim.var

# identity kinematics: the one kind that enters teleop with the joints
# not homed
[KINS]
KINEMATICS = trivkins coordinates=xyz
JOINTS = 3

[HAL]
HALFILE = unhomed.hal

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 400
MAX_LINEAR_ACCELERATION = 1600
DEFAULT_LINEAR_ACCELERATION = 1600
NO_FORCE_HOMING = 1

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 4

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[EMCIO]
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = -10
MAX_LIMIT = 10
MAX_VELOCITY = 200
MAX_ACCELERATION = 1600

[AXIS_Y]
MIN_LIMIT = -10
MAX_LIMIT = 10
MAX_VELOCITY = 200
MAX_ACCELERATION = 1600

[AXIS_Z]
MIN_LIMIT = -10
MAX_LIMIT = 10
MAX_VELOCITY = 200
MAX_ACCELERATION = 1600

[JOINT_0]
TYPE = LINEAR
MAX_VELOCITY = 200
MAX_ACCELERATION = 1600
MIN_LIMIT = -1000
MAX_LIMIT = 1000
HOME_SEQUENCE = 0

[JOINT_1]
TYPE = LINEAR
MAX_VELOCITY = 200
MAX_ACCELERATION = 1600
MIN_LIMIT = -1000
MAX_LIMIT = 1000
HOME_SEQUENCE = 0

[JOINT_2]
TYPE = LINEAR
MAX_VELOCITY = 200
MAX_ACCELERATION = 1600
MIN_LIMIT = -1000
MAX_LIMIT = 1000
HOME_SEQUENCE = 0

[EMC]
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
PARAMETER_FILE = sim.var

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[HAL]
HALFILE = sim.hal

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
DEFAULT_LINEAR_VELOCITY = 100
MAX_LINEAR_VELOCITY = 200
MAX_LINEAR_ACCELERATION = 800

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 4

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[EMCIO]
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 800

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 800
HOME_SEQUENCE = 0

[AXIS_Y]
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 800

[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 800
HOME_SEQUENCE = 0

[AXIS_Z]
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 800

[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 800
HOME_SEQUENCE = 0

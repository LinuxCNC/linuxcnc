[EMC]
VERSION = 1.1

[DISPLAY]
# The client test program is the UI: it connects through the C API, so
# linuxcnc starts it, waits for it and takes its exit status.
DISPLAY = ./client-test

[RS274NGC]
PARAMETER_FILE = client-test.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
HALFILE = client-test.hal

[TRAJ]
AXES =                  3
COORDINATES =           X Y Z
HOME =                  0 0 0
LINEAR_UNITS =          mm
ANGULAR_UNITS =         degree
DEFAULT_LINEAR_VELOCITY =      10
MAX_LINEAR_ACCELERATION =      1000
MAX_LINEAR_VELOCITY =          100

[EMCIO]
EMCIO = iocontrol
TOOL_TABLE = client-test.tbl
RANDOM_TOOLCHANGER = 0

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000

[JOINT_0]
TYPE =             LINEAR
HOME =             0.000
HOME_SEQUENCE =    0
HOME_ABSOLUTE_ENCODER = 1
MAX_VELOCITY =     100
MAX_ACCELERATION = 1000
MIN_LIMIT =        -1000
MAX_LIMIT =        1000
FERROR =           0.001

[AXIS_Y]
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000

[JOINT_1]
TYPE =             LINEAR
HOME =             0.000
HOME_SEQUENCE =    0
HOME_ABSOLUTE_ENCODER = 1
MAX_VELOCITY =     100
MAX_ACCELERATION = 1000
MIN_LIMIT =        -1000
MAX_LIMIT =        1000
FERROR =           0.001

[AXIS_Z]
MIN_LIMIT = -1000
MAX_LIMIT = 1000
MAX_VELOCITY = 100
MAX_ACCELERATION = 1000

[JOINT_2]
TYPE =             LINEAR
HOME =             0.000
HOME_SEQUENCE =    0
HOME_ABSOLUTE_ENCODER = 1
MAX_VELOCITY =     100
MAX_ACCELERATION = 1000
MIN_LIMIT =        -1000
MAX_LIMIT =        1000
FERROR =           0.001

[EMC]
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G49 G54 G64 P0.001 G80 G90 G92.1 G94 G97 G98
PARAMETER_FILE = sim.var

[KINS]
KINEMATICS = genserkins
JOINTS = 6

[HAL]
HALFILE = sim.hal
# the modified DH parameters of the RV-6SDL, as the melfa-sim config has them
HALCMD = setp genserkins.A-1 85
HALCMD = setp genserkins.A-2 380
HALCMD = setp genserkins.A-3 100
HALCMD = setp genserkins.ALPHA-1 -1.570796326
HALCMD = setp genserkins.ALPHA-3 -1.570796326
HALCMD = setp genserkins.ALPHA-4 1.570796326
HALCMD = setp genserkins.ALPHA-5 -1.570796326
HALCMD = setp genserkins.D-0 350
HALCMD = setp genserkins.D-3 425
HALCMD = setp genserkins.D-5 235

[TRAJ]
COORDINATES = XYZABC
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
DEFAULT_LINEAR_VELOCITY = 100
MAX_LINEAR_VELOCITY = 120
MAX_LINEAR_ACCELERATION = 700
DEFAULT_LINEAR_ACCELERATION = 300
NO_FORCE_HOMING = 1

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 4

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[EMCIO]
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = -5000
MAX_LIMIT = 5000
MAX_VELOCITY = 200
MAX_ACCELERATION = 700

[AXIS_Y]
MIN_LIMIT = -5000
MAX_LIMIT = 5000
